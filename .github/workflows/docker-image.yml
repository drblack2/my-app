name: CI-CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ==========================================
  # CI - BUILD AND PUSH DOCKER IMAGE TO PUBLIC ECR
  # ==========================================

  build-and-push:
    name: Build Docker Image and Push to Public ECR
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Login to Public ECR
      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      # Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t argo:latest .

      # Tag image for Public ECR
      - name: Tag Docker Image
        run: |
          docker tag argo:latest \
            public.ecr.aws/q2b5c9d7/argo:latest

      # Push image
      - name: Push Image to Public ECR
        run: |
          docker push \
            public.ecr.aws/q2b5c9d7/argo:latest
