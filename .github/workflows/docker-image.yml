name: CI-CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ==========================================
  # CI - BUILD AND PUSH DOCKER IMAGE TO ECR
  # ==========================================

  build-and-push:
    name: Build Docker Image and Push to ECR
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t my-app:latest .

      - name: Tag Docker Image
        run: |
          docker tag my-app:latest \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/my-app:latest

      - name: Push Image to ECR
        run: |
          docker push \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/my-app:latest


  # ==========================================
  # CD - DEPLOY DOCKER IMAGE TO EC2
  # ==========================================

  deploy-to-ec2:
    name: Deploy Docker Image to EC2
    runs-on: ubuntu-latest

    needs: build-and-push

    steps:

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 22

          timeout: 60s
          command_timeout: 10m

          script: |

            set -e

            echo "======================================"
            echo "CONNECTED TO EC2"
            echo "======================================"

            whoami
            hostname
            pwd

            echo "======================================"
            echo "CHECKING DOCKER"
            echo "======================================"

            docker --version
            docker info > /dev/null

            echo "Docker is running successfully"

            echo "======================================"
            echo "CHECKING AWS CLI"
            echo "======================================"

            aws --version

            echo "======================================"
            echo "LOGIN TO ECR"
            echo "======================================"

            aws ecr get-login-password \
              --region ap-south-1 | \
              docker login \
              --username AWS \
              --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

            echo "ECR LOGIN SUCCESSFUL"

            echo "======================================"
            echo "PULLING LATEST IMAGE"
            echo "======================================"

            docker pull \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/my-app:latest

            echo "IMAGE PULLED SUCCESSFULLY"

            echo "======================================"
            echo "STOPPING OLD CONTAINER"
            echo "======================================"

            docker stop my-app-container || true

            echo "======================================"
            echo "REMOVING OLD CONTAINER"
            echo "======================================"

            docker rm my-app-container || true

            echo "======================================"
            echo "STARTING NEW CONTAINER"
            echo "======================================"

            docker run -d \
              --name my-app-container \
              --restart unless-stopped \
              -p 7777:80 \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com/my-app:latest

            echo "======================================"
            echo "CONTAINER STATUS"
            echo "======================================"

            docker ps

            echo "======================================"
            echo "CONTAINER LOGS"
            echo "======================================"

            docker logs --tail 50 my-app-container

            echo "======================================"
            echo "TESTING APPLICATION"
            echo "======================================"

            sleep 5

            curl -f http://localhost:7777

            echo ""
            echo "======================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "======================================"
